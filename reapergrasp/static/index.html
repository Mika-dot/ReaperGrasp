<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReaperGrasp</title><style>
*{box-sizing:border-box}body{margin:0;background:#101720;color:#e9edf4;font:18px system-ui}header{padding:24px 32px;border-bottom:1px solid #334155;display:flex;justify-content:space-between}h1{margin:0;font-size:26px}main{padding:24px 32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px}article{background:#1b2634;border:2px solid #64748b;border-radius:12px;overflow:hidden}article img{width:100%;height:300px;object-fit:contain;background:#090e14}article p{margin:16px}.normal{border-color:#38bc8a}.defect,.inference_error,.camera_error{border-color:#f26d76}.review,.warming_up,.stale,.overloaded{border-color:#edb855}#notice{color:#edb855;margin-bottom:20px}button{background:#263c53;color:white;padding:12px;border:1px solid #64748b;border-radius:8px;cursor:pointer}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #334155}small{color:#9dafc3}a{color:#8dc9ff}
</style><header><h1>ReaperGrasp <small>Контроль поверхности</small></h1><button onclick="document.documentElement.requestFullscreen()">На весь экран</button></header><main><div id="notice">Загрузка системы…</div><div id="cameras" class="grid"></div><details><summary>Настройки</summary><p><small>Применение перезапускает анализ. USB определяется автоматически. RTSP-адреса задаются в cameras. ROI: ID камеры → [x,y,ширина,высота].</small></p><textarea id="settings" style="width:100%;height:230px"></textarea><p><button onclick="saveSettings()">Сохранить и применить</button> <span id="saved"></span></p></details><h2>Журнал событий</h2><table><thead><tr><th>Время</th><th>Камера</th><th>Результат</th><th>Кадр</th></tr></thead><tbody id="events"></tbody></table></main><script>
fetch('/api/settings').then(r=>r.json()).then(s=>document.querySelector('#settings').value=JSON.stringify(s,null,2));
async function saveSettings(){try{let r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(JSON.parse(document.querySelector('#settings').value))});document.querySelector('#saved').textContent=r.ok?'Настройки применяются':JSON.stringify(await r.json())}catch(e){document.querySelector('#saved').textContent=String(e)}}
const labels={normal:'Норма',defect:'Дефект',review:'Нужна проверка: модели расходятся',warming_up:'Накопление 16 кадров',stale:'Данные устарели',overloaded:'Не хватает производительности',camera_error:'Ошибка камеры',inference_error:'Ошибка анализа',connecting:'Подключение'};
const el=(tag,text)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
async function update(){try{let s=await fetch('/api/status').then(r=>r.json());document.querySelector('#notice').textContent=[s.source==='demo'?'ДЕМОНСТРАЦИЯ — записанные кадры':'Камеры',s.device||'Инициализация',s.error,s.storage_error&&'Ошибка журнала: '+s.storage_error,s.fallback_reason,!s.cameras.length?'Камеры не найдены. Подключите USB-камеру.':''].filter(Boolean).join(' · ');let root=document.querySelector('#cameras');for(let c of s.cameras){let card=document.getElementById('cam-'+c.id);if(!card){card=el('article');card.id='cam-'+c.id;card.append(el('img'),el('p'),el('p'));root.append(card)}card.className=c.state;card.children[0].src='/api/frame/'+encodeURIComponent(c.id)+'?t='+Date.now();card.children[1].textContent=c.label+' · '+(labels[c.state]||c.state);card.children[2].textContent=(c.error||'Кадров в окне: '+c.history_size+' / 16')+' · Пропущено: '+(c.dropped||0)}for(let card of [...root.children])if(!s.cameras.some(c=>'cam-'+c.id===card.id))card.remove();}catch(e){document.querySelector('#notice').textContent='Нет связи с обработчиком. Результаты недействительны.';document.querySelector('#cameras').replaceChildren()}setTimeout(update,700)}
async function events(){try{let rows=await fetch('/api/events').then(r=>r.json()),body=document.querySelector('#events');body.replaceChildren();for(let r of rows){let tr=el('tr');tr.append(el('td',new Date(r.created*1000).toLocaleString()),el('td',r.camera),el('td',labels[r.state]||r.state));let td=el('td'),a=el('a','Снимок');a.href='/api/events/'+r.id+'/image';a.target='_blank';td.append(a);tr.append(td);body.append(tr)}}catch(e){}setTimeout(events,5000)}update();events();
</script></html>
