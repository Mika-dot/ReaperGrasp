name: Inspect saved boot diagnostics
on:
  push:
    paths: ['.github/workflows/diagnose-boot.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Mika-dot/ReaperGrasp
          run-id: 34758379031
          name: ReaperGrasp-experimental-ISO
          path: saved
      - name: Inspect with QMP
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3-pil tesseract-ocr xorriso
          xorriso -osirrox on -indev saved/output/live-image-amd64.hybrid.iso -extract /isolinux boot-tree/isolinux
          chmod -R u+w boot-tree
          /usr/bin/python3 linux/configure-autoboot.py boot-tree
          xorriso -indev saved/output/live-image-amd64.hybrid.iso -outdev /tmp/autoboot.iso -boot_image any replay -map boot-tree/isolinux/isolinux.cfg /isolinux/isolinux.cfg
          /usr/bin/python3 tools/inspect_saved_iso.py /tmp/autoboot.iso inspected --timeout 360
      - name: Read diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('inspected').rglob('*'):
              if p.suffix in ('.json','.log'):
                  print('\nFILE',p)
                  print(p.read_text(errors='replace')[-24000:])
          PY
      - name: Save diagnostic screenshot
        if: hashFiles('inspected/boot.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "boot-diagnostics-${GITHUB_SHA:0:12}" $(find inspected -type f ! -empty \( -name boot.png -o -name boot-result.json -o -name boot-serial.log -o -name qemu.log \)) --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Experimental boot diagnostics' --notes 'Diagnostic files from the failed virtual-machine boot test. Not a deployable release.'
